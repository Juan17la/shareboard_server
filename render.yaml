# Render Blueprint (Dashboard → New → Blueprint → this repo). Secrets marked
# `sync: false` are asked for once in the dashboard and never stored here.
services:
  - type: web
    name: shareboard-server
    # Deploys follow main; develop is work in progress.
    branch: main
    runtime: node
    plan: free
    # --include=dev: tsc is a devDependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # A deploy only takes traffic once /health reaches MongoDB; the old
    # instance then gets SIGTERM and flushes its boards before exiting.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Atlas: Network Access must allow Render (0.0.0.0/0, or the service's
      # outbound IPs from its Connect tab), or the TLS handshake is refused.
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: shareboard
      - key: TOKEN_SECRET
        generateValue: true
      # The web app's URL, e.g. https://shareboard-web.onrender.com ("*" allows any).
      - key: CORS_ORIGIN
        sync: false
      # Verification and password-reset emails go out over SMTP (Gmail by
      # default), and Render's free plan blocks outbound SMTP: on `plan: free`
      # no email is sent. Use a paid instance, or run the server on EC2
      # (README → "Deploy (AWS EC2)").
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Proxy hops whose X-Forwarded-For is believed, so per-address rate limits
      # see the caller and not Render's load balancer. Check `req.ip` in the logs
      # after a deploy: it should be your own address, not a 10.x one.
      - key: TRUST_PROXY
        value: "1"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
